worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 30;
    client_header_timeout 10s;
    client_body_timeout 30s;
    client_max_body_size 6m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;

    server {
        listen 8080;
        server_name _;
        location / {
            limit_req zone=admin burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://uploader:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_read_timeout 35s;
        }
    }

    server {
        listen 8081;
        server_name ~^(?<app_slug>[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?)\.(?:pages\.[^:]+|localhost)$;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "sandbox allow-scripts allow-same-origin allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src https:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; frame-ancestors 'none'" always;
        location = / {
            alias /srv/pages/$app_slug.html;
            default_type text/html;
            charset utf-8;
        }
        location ~ "^/pages/([a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?)\.html$" {
            alias /srv/pages/$1.html;
            default_type text/html;
            charset utf-8;
        }
    }

    server {
        listen 8081 default_server;
        server_name _;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "sandbox allow-scripts allow-same-origin allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src https:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; frame-ancestors 'none'" always;
        location / {
            root /srv/pages;
            index index.html;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            default_type text/html;
            charset utf-8;
        }
        location = /pages/ {
            alias /srv/pages/;
            index index.html;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            default_type text/html;
            charset utf-8;
        }
        location ~ "^/pages/([a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?)\.html$" {
            alias /srv/pages/$1.html;
            default_type text/html;
            charset utf-8;
        }
    }
}
