worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 30;
    client_header_timeout 10s;
    client_body_timeout 30s;
    client_max_body_size 6m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;

    # Administration origin. Authentication is performed by the Go backend.
    server {
        listen 8080;
        server_name _;
        location = /healthz { return 404; }
        location / {
            limit_req zone=admin burst=20 nodelay;
            limit_req_status 429;
            set $backend uploader:8080;
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_read_timeout 35s;
        }
    }

    # Public origin: only generated HTML filenames are served.
    server {
        listen 8081;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control "no-store" always;
        # Safe default for uploaded HTML: no scripts/forms/external assets.
        add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        autoindex off;
        location ~ "^/pages/([a-f0-9]{32})\.html$" {
            alias /srv/pages/$1.html;
            default_type text/html;
            charset utf-8;
            limit_except GET { deny all; }
        }
        location / { return 404; }
    }
}
