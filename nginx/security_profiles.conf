# Nginx CSP & Security Profiles
map $http_x_security_profile $csp_policy {
    default             "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; sandbox;";
    "static"            "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; sandbox;";
    "interactive-local" "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; sandbox allow-scripts allow-forms allow-modals allow-downloads;";
    "api-enabled"       "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; sandbox allow-scripts allow-forms allow-modals allow-downloads;";
}

add_header Content-Security-Policy $csp_policy always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
