{{- if eq .Values.config.adminOrigin .Values.config.publicUrl }}
{{- fail "adminOrigin and publicUrl must differ" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      server_tokens off;
      access_log /dev/stdout;
      sendfile on;
      keepalive_timeout 30;
      client_header_timeout 10s;
      client_body_timeout 30s;
      client_max_body_size {{ .Values.config.maxUploadBytes | int }};
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;
      # Pods share networking: Go occupies 8080; admin NGINX uses 8082.
      server {
        listen 8082;
        server_name _;
        location = /healthz { return 404; }
        location = /readyz { access_log off; return 200; }
        location / {
          limit_req zone=admin burst=20 nodelay;
          limit_req_status 429;
          proxy_pass http://127.0.0.1:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header Connection "";
          proxy_request_buffering off;
          proxy_read_timeout 35s;
        }
      }
      server {
        listen 8081;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "sandbox allow-scripts allow-same-origin allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src https:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; frame-ancestors 'none'" always;
        autoindex off;
        location ~ "^/pages/([a-f0-9]{32})\.html$" {
          alias /srv/pages/$1.html;
          default_type text/html;
          charset utf-8;
          limit_except GET { deny all; }
        }
        location / { return 404; }
      }
    }
