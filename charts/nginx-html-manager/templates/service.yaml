{{- if eq .Values.service.adminPort .Values.service.publicPort }}
{{- fail "adminPort and publicPort must differ" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}}
spec:
  type: {{ .Values.service.type }}
  selector: {app.kubernetes.io/instance: {{ .Release.Name | quote }}}
  ports:
    - {name: admin, port: {{ .Values.service.adminPort }}, targetPort: admin}
    - {name: public, port: {{ .Values.service.publicPort }}, targetPort: public}
