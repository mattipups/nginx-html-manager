name: nginx-html-manager
services:
  uploader:
    image: local/html-manager:1.4.0
    build:
      context: .
      args:
        GO_IMAGE: ${GO_IMAGE:-cgr.dev/chainguard/go:latest-dev}
        STATIC_IMAGE: ${STATIC_IMAGE:-cgr.dev/chainguard/static:latest}
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:8080}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8081}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      MAX_PAGES: ${MAX_PAGES:-500}
      DATA_DIR: /data
    secrets: [admin_password]
    volumes:
      - {type: volume, source: html-data, target: /data}
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 32
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: [CMD, /app/server, healthcheck]
      interval: 5s
      timeout: 2s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  nginx:
    image: local/html-manager-nginx:1.4.0
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-cgr.dev/chainguard/nginx:latest}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
      - "${BIND_ADDRESS:-127.0.0.1}:8081:8081"
    volumes:
      - type: volume
        source: html-data
        target: /srv/pages
        read_only: true
        volume: {subpath: public, nocopy: true}
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 32
    cpus: 1.0
    restart: unless-stopped
    depends_on:
      uploader: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  html-data:
    name: ${HTML_VOLUME_NAME:-nginx-html-manager-html-data}
secrets:
  admin_password:
    file: ./secrets/admin_password.txt
